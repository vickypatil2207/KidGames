<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B" />
      <stop offset="100%" stop-color="#C01111" />
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#FEF08A" />
  <!-- Dice Cube -->
  <rect x="20" y="20" width="60" height="60" rx="16" fill="url(#diceGrad)" />
  <!-- Dice Dots (5 dots) -->
  <circle cx="34" cy="34" r="5" fill="#FFF" />
  <circle cx="66" cy="34" r="5" fill="#FFF" />
  <circle cx="50" cy="50" r="5" fill="#FFF" />
  <circle cx="34" cy="66" r="5" fill="#FFF" />
  <circle cx="66" cy="66" r="5" fill="#FFF" />
</svg>
