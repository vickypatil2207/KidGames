<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>
  <!-- Card Background -->
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)"/>
  
  <!-- Mini Keyboard Base -->
  <rect x="12" y="44" width="76" height="44" rx="10" fill="#1E1B4B" opacity="0.6"/>
  
  <!-- Keyboard Keys -->
  <rect x="18" y="50" width="18" height="15" rx="4" fill="url(#keyGrad)"/>
  <text x="27" y="62" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="11" fill="#4338CA" text-anchor="middle">A</text>
  
  <rect x="41" y="50" width="18" height="15" rx="4" fill="#FDE047"/>
  <text x="50" y="62" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="11" fill="#B45309" text-anchor="middle">B</text>
  
  <rect x="64" y="50" width="18" height="15" rx="4" fill="url(#keyGrad)"/>
  <text x="73" y="62" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="11" fill="#4338CA" text-anchor="middle">C</text>
  
  <!-- Spacebar -->
  <rect x="25" y="70" width="50" height="12" rx="4" fill="#06D6A0"/>
  <text x="50" y="79" font-family="'Fredoka', sans-serif" font-weight="bold" font-size="8" fill="#FFFFFF" text-anchor="middle">TYPE</text>

  <!-- Glowing Microphone -->
  <g transform="translate(50, 24)">
    <circle cx="0" cy="0" r="14" fill="url(#micGrad)"/>
    <rect x="-4" y="-8" width="8" height="11" rx="4" fill="#FFFFFF"/>
    <path d="M -7 -2 C -7 5 7 5 7 -2" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <line x1="0" y1="5" x2="0" y2="8" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="-4" y1="8" x2="4" y2="8" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
