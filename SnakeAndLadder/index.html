<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐍 Snake & Ladder 🪜 — Kids Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Bungee&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <!-- Animated snake background -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- Floating decorations -->
  <div class="floating-deco" aria-hidden="true">
    <span>🐍</span><span>🪜</span><span>🎲</span><span>⭐</span>
    <span>🦋</span><span>🌈</span><span>🎈</span><span>🍭</span>
  </div>

  <header class="app-header">
    <h1 class="title">
      <span class="title-emoji">🐍</span>
      <span class="title-text">Snake &amp; Ladder</span>
      <span class="title-emoji">🪜</span>
    </h1>
    <p class="subtitle">A colorful adventure for little champions!</p>
  </header>

  <main class="game-shell">
    <!-- Board -->
    <section class="board-wrap" aria-label="Game board">
      <div id="board" class="board"></div>
    </section>

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="card turn-card">
        <div class="turn-label">Now Rolling</div>
        <div id="turn-indicator" class="turn-indicator">
          <span class="turn-dot"></span>
          <span class="turn-name">Player 1</span>
        </div>
      </div>

      <div class="card dice-card">
        <div class="dice-label">Tap to Roll!</div>
        <div id="dice" class="dice" role="button" tabindex="0" aria-label="Roll the dice">
          <span class="dice-face" data-face="1">⚀</span>
        </div>
        <button id="roll-btn" class="btn btn-primary" type="button">
          <span>🎲</span><span>Roll Dice</span>
        </button>
      </div>

      <div class="card players-card">
        <h3 class="card-title">Players</h3>
        <ul id="players-list" class="players-list"></ul>
      </div>

      <div class="card log-card">
        <h3 class="card-title">Game Log</h3>
        <ul id="log-list" class="log-list"></ul>
      </div>

      <button id="reset-btn" class="btn btn-ghost" type="button">
        <span>🔄</span><span>New Game</span>
      </button>
    </aside>
  </main>

  <!-- Setup modal -->
  <div id="setup-modal" class="modal open" role="dialog" aria-modal="true" aria-hidden="false">
    <div class="modal-card setup-card">
      <div class="modal-emoji">🐍</div>
      <h2 class="modal-title">Snake &amp; Ladder</h2>
      <p class="modal-text">Set up your game!</p>

      <div class="setup-section">
        <label class="setup-label">Number of Players</label>
        <div class="player-count-group">
          <button class="count-btn active" data-count="2" type="button">2</button>
          <button class="count-btn" data-count="3" type="button">3</button>
          <button class="count-btn" data-count="4" type="button">4</button>
        </div>
      </div>

      <div class="setup-section">
        <label class="setup-label">Game Mode</label>
        <div class="mode-group">
          <button class="mode-btn active" data-mode="local" type="button">
            <span class="mode-icon">👥</span>
            <span>Local</span>
          </button>
          <button class="mode-btn" data-mode="computer" type="button">
            <span class="mode-icon">🤖</span>
            <span>vs Computer</span>
          </button>
        </div>
      </div>

      <div id="player-names" class="setup-section player-names-section">
        <label class="setup-label">Player Names</label>
        <div class="name-inputs"></div>
      </div>

      <button id="start-btn" class="btn btn-primary" type="button">
        <span>🎲</span><span>Start Game</span>
      </button>
    </div>
  </div>

  <!-- Winner modal -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <div class="confetti" aria-hidden="true"></div>
      <div class="modal-emoji">🏆</div>
      <h2 id="modal-title" class="modal-title">You Win!</h2>
      <p id="modal-text" class="modal-text">Amazing roll, champion!</p>
      <button id="modal-close" class="btn btn-primary" type="button">
        <span>🎉</span><span>Play Again</span>
      </button>
    </div>
  </div>

  <script src="js/BoardEntity.js"></script>
  <script src="js/Snake.js"></script>
  <script src="js/Ladder.js"></script>
  <script src="js/Player.js"></script>
  <script src="js/Dice.js"></script>
  <script src="js/Board.js"></script>
  <script src="js/UIManager.js"></script>
  <script src="js/BackgroundAnimation.js"></script>
  <script src="js/Game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
