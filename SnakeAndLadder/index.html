<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🐍 Snake &amp; Ladder 🪜 — Kids Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
</head>
<body>
  <!-- Confetti particle canvas for celebrations -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Top App Header -->
  <header class="app-header">
    <div class="title-wrap">
      <span class="title-icon">🐍</span>
      <h1 class="app-title">Snake &amp; Ladder</h1>
    </div>
    <div class="header-actions">
      <button id="mute-btn" class="icon-btn" type="button" aria-label="Toggle Sound">🔊</button>
      <button id="reset-btn" class="icon-btn" type="button" aria-label="New Game">🔄</button>
    </div>
  </header>

  <!-- Main Game Shell -->
  <main class="game-container">
    <!-- Board -->
    <section class="board-wrap">
      <div id="board"></div>
    </section>

    <!-- Controls Panel / Sidebar -->
    <aside class="controls-panel">
      <!-- Active Turn Card -->
      <div id="turn-banner" class="turn-banner" style="background-color: #ef4444">
        <div id="turn-emoji" class="turn-avatar">🐶</div>
        <div class="turn-info">
          <span id="turn-name" class="turn-name">Player 1</span>
          <span id="turn-msg" class="turn-msg">Tap dice to roll!</span>
        </div>
      </div>

      <!-- Dice Roll Card -->
      <div class="card dice-card">
        <div class="dice-box">
          <div id="dice" class="dice-container" role="button" tabindex="0" aria-label="Roll Dice"></div>
          <button id="roll-btn" class="btn-roll" type="button">
            <span>🎲</span>
            <span>ROLL</span>
          </button>
        </div>
      </div>

      <!-- Scoreboard -->
      <div class="card card-scoreboard">
        <h2 class="card-title">Scoreboard</h2>
        <ul id="players-list" class="players-list"></ul>
      </div>

      <!-- Game Log -->
      <div class="card card-log">
        <h2 class="card-title">Game Activity</h2>
        <ul id="log-list" class="log-list"></ul>
      </div>
    </aside>
  </main>

  <!-- Game Setup Modal -->
  <div id="setup-modal" class="modal-overlay open" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-icon">🎲</div>
      <h2 class="modal-title">Snake &amp; Ladder</h2>

      <!-- Mode selection -->
      <div class="setup-section">
        <label class="setup-label">Game Mode</label>
        <div class="btn-group">
          <button class="opt-btn mode-btn active" data-mode="local" type="button">👥 Pass &amp; Play</button>
          <button class="opt-btn mode-btn" data-mode="computer" type="button">🤖 vs Computer</button>
        </div>
      </div>

      <!-- Player Count selection -->
      <div id="player-count-section" class="setup-section">
        <label class="setup-label">Players</label>
        <div class="btn-group">
          <button class="opt-btn count-btn active" data-count="2" type="button">2</button>
          <button class="opt-btn count-btn" data-count="3" type="button">3</button>
          <button class="opt-btn count-btn" data-count="4" type="button">4</button>
        </div>
      </div>

      <!-- Player Names -->
      <div class="setup-section">
        <label class="setup-label">Player Names</label>
        <div id="name-inputs-container"></div>
      </div>

      <button id="start-btn" class="btn-primary" type="button">🚀 START GAME</button>
    </div>
  </div>

  <!-- Winner Modal -->
  <div id="winner-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-icon">🏆</div>
      <h2 id="winner-name" class="modal-title">You Win!</h2>
      <div id="winner-emoji" style="font-size: 3.5rem;">🎉</div>
      <p style="color: #64748b; font-weight: 500;">Champion of the Jungle!</p>
      <button id="play-again-btn" class="btn-primary" type="button">🎉 PLAY AGAIN</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/board.js"></script>
  <script src="js/dice.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
